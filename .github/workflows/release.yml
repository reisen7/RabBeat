name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.1.0 或 0.2.0-beta.1（会创建 tag v<版本号>）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            name="${INPUT_VERSION#v}"
            tag="v$name"
          else
            tag="${GITHUB_REF_NAME}"
            name="${tag#v}"
          fi
          if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists; pick a new version."
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          prerelease=false
          [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RABBEAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RABBEAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RABBEAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RABBEAT_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$KEYSTORE_BASE64" ]] && missing+=(RABBEAT_KEYSTORE_BASE64)
          [[ -z "$KEYSTORE_PASSWORD" ]] && missing+=(RABBEAT_KEYSTORE_PASSWORD)
          [[ -z "$KEY_ALIAS" ]] && missing+=(RABBEAT_KEY_ALIAS)
          [[ -z "$KEY_PASSWORD" ]] && missing+=(RABBEAT_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RABBEAT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RABBEAT_KEYSTORE_PASSWORD: ${{ secrets.RABBEAT_KEYSTORE_PASSWORD }}
          RABBEAT_KEY_ALIAS: ${{ secrets.RABBEAT_KEY_ALIAS }}
          RABBEAT_KEY_PASSWORD: ${{ secrets.RABBEAT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ needs.version.outputs.name }}" \
            -PversionCode="${{ needs.version.outputs.code }}"

      - name: Collect APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" ]]; then
            echo "::error::Signed APK not found; check the signing secrets."
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/RabBeat-${{ needs.version.outputs.name }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  desktop:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package portable zip and installer
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:packageWindows --no-daemon --stacktrace "-PversionName=${{ needs.version.outputs.name }}"
          $zip = Get-ChildItem "desktopApp/build/compose/binaries/main/portable/RabBeat-*-windows-portable.zip" | Select-Object -First 1
          if (-not $zip) { throw "portable zip was not produced" }
          $setup = Get-ChildItem "desktopApp/build/compose/binaries/main/exe/RabBeat-*-windows-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer exe was not produced" }
          if ($setup.Length -lt 1MB) { throw "installer looks empty: $($setup.Length) bytes" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
          } finally {
            $archive.Dispose()
          }
          if ($names -notcontains "RabBeat.exe") { throw "RabBeat.exe is missing from $($zip.Name)" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            desktopApp/build/compose/binaries/main/portable/*-windows-portable.zip
            desktopApp/build/compose/binaries/main/exe/*-windows-setup.exe
          if-no-files-found: error

  publish:
    needs: [version, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        env:
          VERSION_TAG: ${{ needs.version.outputs.tag }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: |
          tag="$VERSION_TAG"
          name="$VERSION_NAME"
          prev=$(git tag --sort=-creatordate | grep -vx "$tag" | head -1 || true)
          section=$(awk -v v="$name" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' doc/CHANGELOG.md 2>/dev/null || true)
          if [[ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ]]; then
            printf '%s\n' "$section" > changelog.md
          else
            echo "## 更新内容" > changelog.md
            echo "" >> changelog.md
            if [[ -z "$prev" ]]; then
              git log "$tag" --pretty=format:'- %s' --no-merges >> changelog.md
            else
              git log "$prev..$tag" --pretty=format:'- %s' --no-merges >> changelog.md
            fi
          fi
          {
            echo ""
            echo ""
            echo "Windows 安装版：\`RabBeat-${name}-windows-setup.exe\`。"
            echo "Windows 便携版：\`RabBeat-${name}-windows-portable.zip\`，解压后运行 \`RabBeat.exe\`。"
            echo ""
            if [[ -z "$prev" ]]; then
              echo "**完整提交**: https://github.com/${{ github.repository }}/commits/$tag"
            else
              echo "**完整对比**: https://github.com/${{ github.repository }}/compare/$prev...$tag"
            fi
          } >> changelog.md
          cat changelog.md

      - name: Checksums
        run: |
          cd dist
          for f in *; do
            case "$f" in
              *.sha256) continue ;;
            esac
            sha256sum "$f" > "$f.sha256"
          done
          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RabBeat ${{ needs.version.outputs.name }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          body_path: changelog.md
          fail_on_unmatched_files: true
          files: dist/*
